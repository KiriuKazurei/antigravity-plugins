<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="ptrGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <!-- Background occluded window (bottom layer) -->
  <rect x="16" y="20" width="70" height="54" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="3.5" opacity="0.92"/>
  <circle cx="28" cy="31" r="3" fill="#38bdf8"/>
  <circle cx="38" cy="31" r="3" fill="#818cf8"/>
  <line x1="26" y1="44" x2="72" y2="44" stroke="#64748b" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="26" y1="56" x2="58" y2="56" stroke="#64748b" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Foreground overlapping window (translucent glass) -->
  <rect x="38" y="42" width="74" height="58" rx="10" fill="url(#bgGrad)" fill-opacity="0.24" stroke="#94a3b8" stroke-width="3"/>

  <!-- Click ripple ring -->
  <circle cx="64" cy="60" r="14" fill="none" stroke="#22d3ee" stroke-width="2.5" opacity="0.75"/>
  <circle cx="64" cy="60" r="7" fill="#22d3ee" opacity="0.35"/>

  <!-- Independent Agent Virtual Pointer -->
  <path d="M64 60 L64 102 L75 92 L85 109 L92 105 L82 88 L97 86 Z" fill="url(#ptrGrad)" stroke="#0f172a" stroke-width="4" stroke-linejoin="round"/>
</svg>
